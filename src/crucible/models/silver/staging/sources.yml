version: 2

sources:
  - name: bronze
    database: workspace
    schema: "{{ var('bronze_schema', 'bronze') }}"
    tables:
      - name: lab_samples_unpivoted
        description: "Unpivoted vendor CSV data in EAV format"
        columns:
          - name: row_index
            description: "Row position in original CSV file (0-indexed)"
          - name: column_index
            description: "Column position in original CSV file (0-indexed)"
          - name: lab_provided_attribute
            description: "Original column name as provided by the vendor"
          - name: lab_provided_value
            description: "Cell value as a string"
          - name: vendor_id
            description: "Vendor identifier (e.g., vendor_a, vendor_b)"
          - name: file_name
            description: "Source CSV file name"
          - name: ingestion_timestamp
            description: "Timestamp when the file was ingested"

      - name: customer_samples
        description: "Barcode-to-customer assignment table. One row per sample submission, linking a barcode to a customer with submission-level metadata (crop_type, sample_date)."
        columns:
          - name: barcode
            description: "Sample barcode. Foreign key to lab_samples_unpivoted.sample_barcode."
          - name: customer_id
            description: "Foreign key to the customers table."
          - name: crop_type
            description: "Crop being tested (e.g., Corn, Soybeans). Commercially sensitive."
          - name: sample_date
            description: "Date the sample was submitted. String in YYYY-MM-DD format."

      - name: customers
        description: "Unique customer profiles. One row per customer. PII fields include name, email, address, date_of_birth."
        columns:
          - name: customer_id
            description: "Primary key. Format: CUST-XXXXXX (uppercase hex suffix)."
          - name: customer_name
          - name: date_of_birth
            description: "String in YYYY-MM-DD format."
          - name: age
            description: "Integer age in years."
          - name: email
          - name: phone
          - name: street_address
          - name: city
          - name: state
            description: "Two-letter US state code."
          - name: zip_code
            description: "Five-digit string."
          - name: notes

      - name: vendor_column_mapping
        description: "Maps vendor-specific column names to canonical column IDs"
        columns:
          - name: vendor_id
            description: "Vendor identifier"
          - name: vendor_column_name
            description: "Column name as used by this vendor"
          - name: canonical_column_id
            description: "Surrogate key linking to canonical_column_definitions"
          - name: notes
            description: "Mapping context or rationale"

  - name: silver
    database: workspace
    schema: "{{ var('silver_schema', 'silver') }}"
    tables:
      - name: canonical_column_definitions
        description: "Canonical column definitions with categories and data types"
        columns:
          - name: canonical_column_id
            description: "Surrogate key for canonical column"
          - name: canonical_column_name
            description: "Standardized column name"
          - name: column_category
            description: "Column category (measurement, sample_identifier, lab_metadata, date)"
          - name: data_type
            description: "Expected data type (numeric, string, date)"
          - name: description
            description: "Human-readable column description"
          - name: is_metadata_column
            description: "True for columns that will be pivoted out into their own fields in the standardized view (sample_barcode, lab_id, date_received, date_analyzed); False for measurement columns"
