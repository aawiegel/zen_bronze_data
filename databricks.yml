# This is a Databricks asset bundle definition for flexible-data-processing.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: zen_bronze_data

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-81f4a118-bb2c.cloud.databricks.com

resources:
  schemas:
    bronze_schema:
      name: bronze
      catalog_name: workspace
      comment: "Bronze layer schema for raw data"

    silver_schema:
      name: silver
      catalog_name: workspace
      comment: "Silver layer schema for cleaned data"
    
    gold_schema:
      name: gold
      catalog_name: workspace
      comment: "Gold layer schema for analysis-ready data sets"

  volumes:
    incoming:
      catalog_name: workspace
      name: incoming
      schema_name: bronze

  jobs:
    generate_sample_files:
      name: "Generate Sample CSV Files"
      tasks:
        - task_key: generate_files
          notebook_task:
            notebook_path: ./notebooks/generate_sample_files.py
            source: WORKSPACE
            base_parameters:
              catalog: workspace
              bronze_schema: ${resources.schemas.bronze_schema.name}
              silver_schema: ${resources.schemas.silver_schema.name}
              incoming_volume: ${resources.volumes.incoming.name}

    dbt_silver_transform:
      name: "dbt Silver Layer Transform"
      environments:
        - environment_key: dbt_env
          spec:
            environment_version: '4'
            dependencies:
              - dbt-databricks>=1.10.0
      tasks:
        - task_key: dbt_run
          environment_key: dbt_env
          dbt_task:
            project_directory: src/crucible
            commands:
              - "dbt deps"
              - "dbt run --select silver --vars '{bronze_schema: ${resources.schemas.bronze_schema.name}, silver_schema: ${resources.schemas.silver_schema.name}}'"
            warehouse_id: 36941a39f097afd3
            catalog: workspace
            schema: ${resources.schemas.silver_schema.name}
