version: 2

models:
  - name: stg_lab_samples_standardized
    description: >
      Silver layer: unpivoted bronze data joined with mapping tables
      for canonical column standardization. Preserves all original bronze
      columns for lineage while adding standardized column information
      via LEFT JOINs. Unmapped attributes pass through with NULL
      canonical values.
    columns:
      - name: row_index
        description: "Row position in original CSV file (0-indexed)"
      - name: column_index
        description: "Column position in original CSV file (0-indexed)"
      - name: lab_provided_attribute
        description: "Original column name as provided by the vendor"
      - name: lab_provided_value
        description: "Cell value as a string"
      - name: vendor_id
        description: "Vendor identifier (e.g., vendor_a, vendor_b)"
      - name: file_name
        description: "Source CSV file name"
      - name: ingestion_timestamp
        description: "Timestamp when the file was ingested"
      - name: canonical_column_id
        description: "Surrogate key linking to canonical column definitions (NULL if unmapped)"
      - name: canonical_column_name
        description: "Standardized column name (NULL if unmapped)"
      - name: column_category
        description: "Column category: measurement, sample_identifier, lab_metadata, or date (NULL if unmapped)"
      - name: data_type
        description: "Expected data type: numeric, string, or date (NULL if unmapped)"
